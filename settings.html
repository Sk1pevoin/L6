<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronos — Настройки</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Chronos</h1>
            <span class="current-month">Параметры</span>
        </header>
        <main class="app-main">
            <section class="settings-section">
                <h2 class="page-title">Настройки приложения</h2>
                <ul class="settings-list">
                    <li class="setting-item">
                        <span>Уведомления</span>
                        <span class="setting-value">Включены</span>
                    </li>
                    <li class="setting-item">
                        <span>Тема оформления</span>
                        <span class="setting-value">Космос</span>
                    </li>
                    <li class="setting-item">
                        <span>Первый день недели</span>
                        <span class="setting-value">Понедельник</span>
                    </li>
                    <li class="setting-item">
                        <span>Формат времени</span>
                        <span class="setting-value">24 часа</span>
                    </li>
                </ul>
            </section>
        </main>
        <nav class="app-nav">
            <a href="index.html" class="nav-link">Календарь</a>
            <a href="events.html" class="nav-link">События</a>
            <a href="settings.html" class="nav-link">Настройки</a>
        </nav>
        <footer class="app-footer">
            <p>&copy; 2026 Chronos. Все права защищены.</p>
        </footer>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
